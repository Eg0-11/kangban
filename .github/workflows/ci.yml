name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kangban-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: kangban-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid

  backend:
    runs-on: ubuntu-latest
    env:
      KANGBAN_RUN_LIVE_RAG: "false"
    defaults:
      run:
        working-directory: kangban-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"
      - run: python -m pip install uv==0.12.18
      - name: Initialize locked Python environment
        run: uv sync --project ../kangban-agent --locked --python 3.12.14
      - name: Python tests
        working-directory: kangban-agent
        run: uv run --locked python -m pytest -q
      - name: Java clean build and local Python integration
        run: >-
          mvn --batch-mode clean verify -Dspring.profiles.active=test
          -Dapp.ai.provider=mock -Dapp.agent.rag.embedding-provider=local
          -Dapp.mcp.public.enabled=false -Dspring.ai.mcp.client.enabled=false
      - name: Validate actual Java callback responses
        working-directory: kangban-agent
        run: uv run --locked python scripts/check-java-contract.py
