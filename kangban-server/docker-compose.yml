services:
  mysql:
    image: mysql:8.0
    container_name: kangban-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${KANGBAN_DB_PASSWORD}
      MYSQL_DATABASE: kangban
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: kangban-redis
    command: redis-server --requirepass ${KANGBAN_REDIS_PASSWORD}
    environment:
      KANGBAN_REDIS_PASSWORD: ${KANGBAN_REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${KANGBAN_REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: kangban-minio
    environment:
      MINIO_ROOT_USER: ${KANGBAN_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${KANGBAN_MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent:
    build: ../kangban-agent
    container_name: kangban-agent
    expose:
      - "8093"
    environment:
      APP_AGENT_SERVICE_TOKEN: ${APP_AGENT_SERVICE_TOKEN:?Set a separate Agent service credential}
      APP_AGENT_JAVA_BASE_URL: http://app:8080
      APP_AGENT_INTERNAL_MAX_REQUEST_MS: ${APP_AGENT_INTERNAL_MAX_REQUEST_MS:-170000}
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-qwen}
      APP_AI_API_URL: ${APP_AI_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      APP_AI_API_KEY: ${APP_AI_API_KEY:-}
      APP_AI_AI_MODEL: ${APP_AI_AI_MODEL:-qwen3.7-plus-2026-05-26}
      APP_AI_CONNECT_TIMEOUT: ${APP_AI_CONNECT_TIMEOUT:-10000}
      APP_AI_READ_TIMEOUT: ${APP_AI_READ_TIMEOUT:-120000}
    restart: unless-stopped

  app:
    build: .
    container_name: kangban-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KANGBAN_DB_URL: jdbc:mysql://mysql:3306/kangban?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      KANGBAN_DB_USERNAME: root
      KANGBAN_DB_PASSWORD: ${KANGBAN_DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/kangban?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${KANGBAN_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${KANGBAN_REDIS_PASSWORD}
      KANGBAN_REDIS_HOST: redis
      KANGBAN_REDIS_PASSWORD: ${KANGBAN_REDIS_PASSWORD}
      KANGBAN_MINIO_ENDPOINT: http://minio:9000
      KANGBAN_MINIO_ACCESS_KEY: ${KANGBAN_MINIO_ACCESS_KEY}
      KANGBAN_MINIO_SECRET_KEY: ${KANGBAN_MINIO_SECRET_KEY}
      KANGBAN_MINIO_BUCKET: ${KANGBAN_MINIO_BUCKET:-kangban-files}
      KANGBAN_JWT_SECRET: ${KANGBAN_JWT_SECRET}
      KANGBAN_CAPTCHA_SECRET: ${KANGBAN_CAPTCHA_SECRET:?Set a captcha secret}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-qwen}
      APP_AI_API_KEY: ${APP_AI_API_KEY:-}
      APP_AI_API_URL: ${APP_AI_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      APP_AI_AI_MODEL: ${APP_AI_AI_MODEL:-qwen3.7-plus-2026-05-26}
      APP_AI_OCR_MODEL: ${APP_AI_OCR_MODEL:-qwen3.5-ocr}
      APP_AI_CONNECT_TIMEOUT: ${APP_AI_CONNECT_TIMEOUT:-10000}
      APP_AI_READ_TIMEOUT: ${APP_AI_READ_TIMEOUT:-120000}
      APP_AGENT_ENABLED: ${APP_AGENT_ENABLED:-true}
      APP_AGENT_CONTEXT_SECRET: ${APP_AGENT_CONTEXT_SECRET:?Set a Java-only Agent signing secret}
      APP_AGENT_INTERNAL_ENABLED: "true"
      APP_AGENT_SERVICE_TOKEN: ${APP_AGENT_SERVICE_TOKEN:?Set a separate Agent service credential}
      APP_AGENT_PYTHON_BASE_URL: http://agent:8093
      APP_AGENT_INTERNAL_MAX_REQUEST_MS: ${APP_AGENT_INTERNAL_MAX_REQUEST_MS:-170000}
      APP_AGENT_INTERNAL_CONNECT_TIMEOUT_MS: ${APP_AGENT_INTERNAL_CONNECT_TIMEOUT_MS:-3000}
      APP_AGENT_MODEL_TOOL_CALLING_ENABLED: ${APP_AGENT_MODEL_TOOL_CALLING_ENABLED:-false}
      APP_AGENT_MAX_ITERATIONS: ${APP_AGENT_MAX_ITERATIONS:-5}
      APP_AGENT_MAX_HISTORY_MESSAGES: ${APP_AGENT_MAX_HISTORY_MESSAGES:-12}
      APP_AGENT_MAX_HISTORY_TOKENS: ${APP_AGENT_MAX_HISTORY_TOKENS:-6000}
      APP_AGENT_MAX_HISTORY_MESSAGE_CHARACTERS: ${APP_AGENT_MAX_HISTORY_MESSAGE_CHARACTERS:-4000}
      APP_RAG_ENABLED: ${APP_RAG_ENABLED:-false}
      APP_RAG_PRIVATE_ENABLED: ${APP_RAG_PRIVATE_ENABLED:-true}
      APP_RAG_VECTOR_STORE: ${APP_RAG_VECTOR_STORE:-mysql-jdbc}
      APP_RAG_EMBEDDING_PROVIDER: ${APP_RAG_EMBEDDING_PROVIDER:-local}
      APP_RAG_EMBEDDING_API_URL: ${APP_RAG_EMBEDDING_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings}
      APP_RAG_EMBEDDING_MODEL: ${APP_RAG_EMBEDDING_MODEL:-local-hash-v1}
      APP_RAG_EMBEDDING_DIMENSIONS: ${APP_RAG_EMBEDDING_DIMENSIONS:-128}
    depends_on:
      agent:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  minio-data:
